name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Ordenar archivos en carpetas
        run: |
          D=app/src/main/java/com/leandro/okcopilot
          mkdir -p $D
          if [ -f app.build.gradle.kts ]; then mv app.build.gradle.kts app/build.gradle.kts; fi
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/; fi
          mkdir -p app/src/main/res/xml
          if [ -f accessibility_config.xml ]; then mv accessibility_config.xml app/src/main/res/xml/; fi
          for f in *.kt; do [ -f "$f" ] && mv "$f" $D/; done
          find app -type f
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OkCopilot-apk
          path: app/build/outputs/apk/debug/app-debug.apk
